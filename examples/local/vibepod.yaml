# A pod with nothing remote in it.
#
# Everything is on this machine, so this exercises the parts below the backend
# model: the namespace, the recording shell, and the agent brief. It needs no
# network, so it is the first thing to try and the first thing to blame.
#
#   cd examples/local
#   vibepod up
#   vp run -- /bin/sh -c 'pwd; ls'
#   vp tree
#   vp log
#
# Then, for the real thing — an agent working in a pod, on this repo:
#
#   vp run claude          # or `vibepod` for the cockpit, then ⏎ on the session
#
# Inside the pod the agent can read ~/.claude (its own config and credentials)
# and ~/Git/vibepod, and nothing else of yours: not ~/.ssh, not ~/Documents,
# not another project. Check it:
#
#   vp run -- /bin/sh -c 'ls ~/.ssh'     # No such file or directory
#
# And see what the agent was told about this pod:
#
#   vp brief
pod: vibepod-local

mounts:
  # A local directory keeps its own path inside the pod, so nothing you type
  # or read has to be translated.
  - local: ~/Git/vibepod

host_access:
  # The identity plane: bound from this machine, never transmitted anywhere.
  - ~/.claude
  - ~/.claude.json

exec:
  # The machine a new session opens on. With nothing mounted from elsewhere,
  # `pod` is the only answer there is.
  default: pod
